---
- name: Restart mailcow
  become: yes
  shell: |
    {{ mailcow__compose_command }} --project-name {{ mailcow__config_real.COMPOSE_PROJECT_NAME }} restart
  args:
    chdir: "{{ mailcow__install_path }}"

- name: Recreate mailcow
  become: yes
  shell: |
    {{ mailcow__compose_command }} --project-name {{ mailcow__config_real.COMPOSE_PROJECT_NAME }} down
    {{ mailcow__compose_command }} --project-name {{ mailcow__config_real.COMPOSE_PROJECT_NAME }} up -d
  args:
    chdir: "{{ mailcow__install_path }}"

- name: Restart mailcow rspamd
  become: yes
  shell: |
    {{ mailcow__compose_command }} --project-name {{ mailcow__config_real.COMPOSE_PROJECT_NAME }} restart rspamd-mailcow
  args:
    chdir: "{{ mailcow__install_path }}"
